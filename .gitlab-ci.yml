# GitLab CI/CD for api-auto-test
# 手动推送验证：确认本地 GitLab Runner 能接收并执行 pipeline。
# 设计目标：
#   1. 多阶段流水线（setup -> unit -> smoke/critical -> report -> pages -> notify）
#   2. smoke 与 critical 分阶段执行，兼容旧版 GitLab
#   3. Allure 报告通过 GitLab Pages 自动发布
#   4. 失败时通过企业微信 webhook 通知
#   5. 所有敏感信息通过 GitLab CI/CD Variables 注入，代码中不留痕
#
# 本地 runner 要求：
#   由于测试环境（FAT/UAT）位于公司内网，需使用本地可访问内网的 GitLab Runner。
#   当前使用 macOS shell executor，因此不要写 Docker/Linux 专属命令。
#
# 公司 GitLab 版本较老，不支持 workflow/rules/needs optional 等新语法。
# 这里使用 stages + only/except 的兼容写法。

variables:
  # Python 输出使用 UTF-8，避免 Windows/Linux 混用编码问题
  PYTHONUTF8: "1"
  # pip 缓存目录
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Allure 结果/报告目录
  ALLURE_RESULTS_DIR: "reports/allure-results"
  ALLURE_REPORT_DIR: "reports/allure-report"
  # 默认环境，可在 GitLab CI/CD Variables 中覆盖
  ENV: "fat"
  # 日志级别
  LOG_LEVEL: "INFO"

# pip 依赖缓存，按分支维持续存，显著加速重复安装
cache:
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .pip-cache/

stages:
  - setup
  - unit
  - smoke
  - critical
  - report
  - pages
  - notify

# =========================================================
# setup：安装依赖，验证环境可编译
# =========================================================
setup:
  stage: setup
  tags:
    - api-test
  before_script:
    - |
      set -e
      if command -v python3.12 >/dev/null 2>&1; then
        PYTHON_BIN=python3.12
      else
        PYTHON_BIN=python3
      fi
      "$PYTHON_BIN" -m venv .venv
      .venv/bin/python -m pip install --upgrade pip
      .venv/bin/python -m pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - .venv/bin/python -c "import pytest, httpx, pymysql, yaml; print('deps ok')"
  only:
    - branches
    - triggers
    - schedules

# =========================================================
# unit：纯单元测试，不访问外部接口，跳过 ensure_handover
# =========================================================
unit:
  stage: unit
  tags:
    - api-test
  variables:
    SKIP_HANDOVER: "1"
  before_script:
    - |
      set -e
      if command -v python3.12 >/dev/null 2>&1; then
        PYTHON_BIN=python3.12
      else
        PYTHON_BIN=python3
      fi
      "$PYTHON_BIN" -m venv .venv
      .venv/bin/python -m pip install --upgrade pip
      .venv/bin/python -m pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - .venv/bin/python -m pytest tests/unit -m unit -v --alluredir="$ALLURE_RESULTS_DIR/unit"
  artifacts:
    when: always
    paths:
      - "$ALLURE_RESULTS_DIR/unit"
    expire_in: 1 week
  only:
    - branches
    - triggers
    - schedules

# =========================================================
# smoke：冒烟测试，真实调用 FAT/UAT 接口
# =========================================================
smoke:
  stage: smoke
  tags:
    - api-test
  before_script:
    - |
      set -e
      if command -v python3.12 >/dev/null 2>&1; then
        PYTHON_BIN=python3.12
      else
        PYTHON_BIN=python3
      fi
      "$PYTHON_BIN" -m venv .venv
      .venv/bin/python -m pip install --upgrade pip
      .venv/bin/python -m pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
      missing=0
      echo "CI variable check:"
      for name in LOGIN_MOBILE LOGIN_WORD; do
        eval "value=\"\${$name:-}\""
        if [ -n "$value" ]; then
          echo "$name=SET"
        else
          echo "$name=UNSET"
          missing=1
        fi
      done
      if [ "$ENV" = "uat" ]; then
        URL_VAR=UAT_URL
      else
        URL_VAR=BASE_URL
      fi
      eval "url_value=\"\${$URL_VAR:-}\""
      if [ -n "$url_value" ]; then
        echo "$URL_VAR=SET"
      else
        echo "$URL_VAR=UNSET"
        missing=1
      fi
      if [ "$missing" -ne 0 ]; then
        echo "Missing required CI/CD variables for API login." >&2
        exit 1
      fi
  script:
    - .venv/bin/python scripts/check_login.py
    - .venv/bin/python -m pytest case -m smoke -v --alluredir="$ALLURE_RESULTS_DIR/smoke" --reruns 2 --reruns-delay 1
  artifacts:
    when: always
    paths:
      - "$ALLURE_RESULTS_DIR/smoke"
    expire_in: 1 week
  only:
    - master
    - triggers
    - schedules

# =========================================================
# critical：关键业务测试，与 smoke 并行执行
# =========================================================
critical:
  stage: critical
  tags:
    - api-test
  before_script:
    - |
      set -e
      if command -v python3.12 >/dev/null 2>&1; then
        PYTHON_BIN=python3.12
      else
        PYTHON_BIN=python3
      fi
      "$PYTHON_BIN" -m venv .venv
      .venv/bin/python -m pip install --upgrade pip
      .venv/bin/python -m pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
      missing=0
      echo "CI variable check:"
      for name in LOGIN_MOBILE LOGIN_WORD; do
        eval "value=\"\${$name:-}\""
        if [ -n "$value" ]; then
          echo "$name=SET"
        else
          echo "$name=UNSET"
          missing=1
        fi
      done
      if [ "$ENV" = "uat" ]; then
        URL_VAR=UAT_URL
      else
        URL_VAR=BASE_URL
      fi
      eval "url_value=\"\${$URL_VAR:-}\""
      if [ -n "$url_value" ]; then
        echo "$URL_VAR=SET"
      else
        echo "$URL_VAR=UNSET"
        missing=1
      fi
      if [ "$missing" -ne 0 ]; then
        echo "Missing required CI/CD variables for API login." >&2
        exit 1
      fi
  script:
    - .venv/bin/python scripts/check_login.py
    - .venv/bin/python -m pytest case -m critical -v --alluredir="$ALLURE_RESULTS_DIR/critical" --reruns 2 --reruns-delay 1
  artifacts:
    when: always
    paths:
      - "$ALLURE_RESULTS_DIR/critical"
    expire_in: 1 week
  only:
    - master
    - triggers
    - schedules

# =========================================================
# allure_report：合并多 job 的 Allure 结果，生成 HTML 报告
# =========================================================
allure_report:
  stage: report
  tags:
    - api-test
  variables:
    # 该镜像默认用户非 root，确保目录可写
    CHECK_RESULTS_EVERY_SECONDS: none
    KEEP_HISTORY: "1"
  before_script:
    - mkdir -p "$ALLURE_REPORT_DIR"
  script:
    - |
      if command -v allure >/dev/null 2>&1; then
        allure generate "$ALLURE_RESULTS_DIR" -o "$ALLURE_REPORT_DIR" --clean
      else
        cat > "$ALLURE_REPORT_DIR/index.html" <<'HTML'
      <!doctype html>
      <html lang="zh-CN">
      <head><meta charset="utf-8"><title>Allure CLI 未安装</title></head>
      <body>
      <h1>Allure CLI 未安装</h1>
      <p>测试结果已保存到 artifacts 的 reports/allure-results 目录。</p>
      <p>如需生成 HTML 报告，请在本地 runner 机器安装 allure 命令行工具。</p>
      </body>
      </html>
      HTML
      fi
  artifacts:
    when: always
    paths:
      - "$ALLURE_REPORT_DIR"
      - "$ALLURE_RESULTS_DIR"
    expire_in: 1 week
  only:
    - master
    - triggers
    - schedules

# =========================================================
# pages：将 Allure HTML 报告发布到 GitLab Pages
# 访问地址：https://<username>.gitlab.io/<project-name>
# =========================================================
pages:
  stage: pages
  tags:
    - api-test
  script:
    - mkdir -p public
    - |
      if [ -d "$ALLURE_REPORT_DIR" ] && [ "$(ls -A "$ALLURE_REPORT_DIR" 2>/dev/null)" ]; then
        cp -r "$ALLURE_REPORT_DIR"/* public/
      else
        printf '%s\n' '<!doctype html><html><body><h1>No report generated</h1></body></html>' > public/index.html
      fi
  artifacts:
    paths:
      - public
  only:
    - master
    - triggers
    - schedules

# =========================================================
# notify：失败时发送企业微信通知（带报告链接）
# =========================================================
notify:
  stage: notify
  tags:
    - api-test
  before_script:
    - |
      set -e
      if command -v python3.12 >/dev/null 2>&1; then
        PYTHON_BIN=python3.12
      else
        PYTHON_BIN=python3
      fi
      "$PYTHON_BIN" -m venv .venv
      .venv/bin/python -m pip install --upgrade pip
      .venv/bin/python -m pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - .venv/bin/python scripts/notify_ci_failure.py
  only:
    - master
    - triggers
    - schedules
  when: on_failure
