# GitLab CI/CD for api-auto-test
# 手动推送验证：确认本地 GitLab Runner 能接收并执行 pipeline。
# 设计目标：
#   1. 多阶段流水线（setup -> unit -> smoke/critical -> report -> pages -> notify）
#   2. smoke 与 critical 并行执行（DAG + needs）
#   3. Allure 报告通过 GitLab Pages 自动发布
#   4. 失败时通过企业微信 webhook 通知
#   5. 所有敏感信息通过 GitLab CI/CD Variables 注入，代码中不留痕
#
# 本地 runner 要求：
#   由于测试环境（FAT/UAT）位于公司内网，需使用本地可访问内网的 GitLab Runner。
#   推荐 macOS Docker executor，如 Docker 无法走 VPN，则改用 shell executor。
#
# 公司 GitLab 版本较老，不支持 workflow/rules/needs optional 等新语法。
# 这里使用 stages + only/except 的兼容写法。

variables:
  # Python 输出使用 UTF-8，避免 Windows/Linux 混用编码问题
  PYTHONUTF8: "1"
  # pip 缓存目录
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Allure 结果/报告目录
  ALLURE_RESULTS_DIR: "reports/allure-results"
  ALLURE_REPORT_DIR: "reports/allure-report"
  # 默认环境，可在 GitLab CI/CD Variables 中覆盖
  ENV: "fat"
  # 日志级别
  LOG_LEVEL: "INFO"

# pip 依赖缓存，按分支维持续存，显著加速重复安装
cache:
  key: "${CI_COMMIT_REF_SLUG}-pip"
  paths:
    - .pip-cache/

stages:
  - setup
  - unit
  - smoke
  - critical
  - report
  - pages
  - notify

# =========================================================
# setup：安装依赖，验证环境可编译
# =========================================================
setup:
  stage: setup
  image: python:3.12-slim
  tags:
    - api-test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc default-libmysqlclient-dev pkg-config
  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
    - python -c "import pytest, httpx, pymysql, yaml; print('deps ok')"
  only:
    - branches
    - triggers
    - schedules

# =========================================================
# unit：纯单元测试，不访问外部接口，跳过 ensure_handover
# =========================================================
unit:
  stage: unit
  image: python:3.12-slim
  tags:
    - api-test
  variables:
    SKIP_HANDOVER: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc default-libmysqlclient-dev pkg-config
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - pytest tests/unit -m unit -v --alluredir="$ALLURE_RESULTS_DIR/unit"
  artifacts:
    when: always
    paths:
      - "$ALLURE_RESULTS_DIR/unit"
    expire_in: 1 week
  only:
    - branches
    - triggers
    - schedules

# =========================================================
# smoke：冒烟测试，真实调用 FAT/UAT 接口
# =========================================================
smoke:
  stage: smoke
  image: python:3.12-slim
  tags:
    - api-test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc default-libmysqlclient-dev pkg-config
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - pytest case -m smoke -v --alluredir="$ALLURE_RESULTS_DIR/smoke" --reruns 2 --reruns-delay 1
  artifacts:
    when: always
    paths:
      - "$ALLURE_RESULTS_DIR/smoke"
    expire_in: 1 week
  only:
    - master
    - triggers
    - schedules

# =========================================================
# critical：关键业务测试，与 smoke 并行执行
# =========================================================
critical:
  stage: critical
  image: python:3.12-slim
  tags:
    - api-test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc default-libmysqlclient-dev pkg-config
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - pytest case -m critical -v --alluredir="$ALLURE_RESULTS_DIR/critical" --reruns 2 --reruns-delay 1
  artifacts:
    when: always
    paths:
      - "$ALLURE_RESULTS_DIR/critical"
    expire_in: 1 week
  only:
    - master
    - triggers
    - schedules

# =========================================================
# allure_report：合并多 job 的 Allure 结果，生成 HTML 报告
# =========================================================
allure_report:
  stage: report
  image: frankescobar/allure-docker-service:latest
  tags:
    - api-test
  variables:
    # 该镜像默认用户非 root，确保目录可写
    CHECK_RESULTS_EVERY_SECONDS: none
    KEEP_HISTORY: "1"
  before_script:
    - mkdir -p "$ALLURE_REPORT_DIR"
  script:
    - allure generate "$ALLURE_RESULTS_DIR" -o "$ALLURE_REPORT_DIR" --clean
  artifacts:
    when: always
    paths:
      - "$ALLURE_REPORT_DIR"
      - "$ALLURE_RESULTS_DIR"
    expire_in: 1 week
  only:
    - master
    - triggers
    - schedules

# =========================================================
# pages：将 Allure HTML 报告发布到 GitLab Pages
# 访问地址：https://<username>.gitlab.io/<project-name>
# =========================================================
pages:
  stage: pages
  image: busybox:latest
  tags:
    - api-test
  script:
    - mkdir -p public
    - cp -r "$ALLURE_REPORT_DIR"/* public/
  artifacts:
    paths:
      - public
  only:
    - master
    - triggers
    - schedules

# =========================================================
# notify：失败时发送企业微信通知（带报告链接）
# =========================================================
notify:
  stage: notify
  image: python:3.12-slim
  tags:
    - api-test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc default-libmysqlclient-dev pkg-config
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
  script:
    - python scripts/notify_ci_failure.py
  only:
    - master
    - triggers
    - schedules
  when: on_failure
